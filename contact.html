<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project CH&F - Contact</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css?v=15">
    <link rel="icon" type="image/png" href="./sources/favicon.png?v=3">
</head>

<body>
    <header class="header">
        <h1 class="logo"><a href="index.html"><img src="./sources/Logo.png" alt="Project CHnF"></a></h1>
        <nav class="nav">
            <button class="menu-toggle" aria-label="Toggle Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-links">
                <li><a href="works.html">Works</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" style="font-weight: 600; color: var(--text-color);">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content about-page" id="main-content">
        <div class="about-container">
            <h2 class="about-title">Contact us</h2>
            <div class="about-content contact-layout" style="display: flex; flex-direction: column; gap: 3rem;">
                <div class="contact-block">
                    <h4>Address.</h4>
                    <div id="address-field">
                        <!-- JS에서 주소 렌더링 -->
                    </div>
                </div>

                <div class="contact-block">
                    <h4>Phone.</h4>
                    <p id="phone-field"><!-- JS에서 전화번호 렌더링 --></p>
                </div>

                <div class="contact-block">
                    <h4>E-mail.</h4>
                    <p id="email-field"><!-- JS에서 이메일 렌더링 --></p>
                </div>

                <div class="contact-block">
                    <h4>Instagram.</h4>
                    <p id="instagram-field">
                        <!-- JS에서 인스타그램 렌더링 -->
                    </p>
                </div>

                <div class="contact-copyright"
                    style="margin-top: 4rem; padding-top: 2rem; border-top: 1px solid rgba(0, 0, 0, 0.08); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">
                    <h4
                        style="font-size: 1rem; font-weight: 600; margin-bottom: 0.8rem; color: var(--text-color); letter-spacing: 0.05em; text-align: center;">
                        Image Usage & Copyright</h4>
                    <p
                        style="font-size: 0.95rem; line-height: 1.8; color: var(--text-color); margin: 0; text-align: center;">
                        본 웹사이트의 모든 사진은 <strong>Project CH&F</strong>에게 저작권이 있습니다. <br>이미지 라이선스 구매나 사용 허가가 필요하신 경우 위의
                        연락처로 문의
                        바랍니다.</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 모바일 메뉴 토글
        document.querySelector('.menu-toggle').addEventListener('click', function () {
            document.body.classList.toggle('menu-open');
            document.querySelector('.nav-links').classList.toggle('active');
            this.classList.toggle('open');
        });

        // 엔터(\n)를 <br> 태그로 예쁘게 바꿔주는 함수 (주소용)
        function formatAddress(text) {
            if (!text) return '';
            return text.split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0)
                .join('<br>');
        }

        // 워드프레스 데이터 연동 로직
        const WP_API_URL = 'https://chinhyosook.com/wp-json/wp/v2/pages?slug=contact';

        async function initContactPage() {
            try {
                const response = await fetch(WP_API_URL);
                if (!response.ok) throw new Error('서버 통신 에러');

                const pages = await response.json();
                if (pages.length === 0) throw new Error('Contact 페이지를 찾을 수 없습니다.');

                const acf = pages[0].acf || {};

                // 1. 데이터 추출 (기본값 설정)
                const addressName = acf.address_name || acf['address name'] || '[ Project CH&F ]';
                const addressKo = acf.address || '서울시 중구 을지로 114-10';
                const addressDetail = acf.address_detail || acf['address detail'] || '상지빌딩 10층 1003호';
                const addressEn = acf.address_en || 'Room 1003, 10F, Sangji-Building, 114-10 Eulji-ro, Jung-gu, Seoul, Republic of Korea';

                const phone = acf.phone || '010.0000.0000';
                const email = acf['e-mail'] || 'example@gmail.com';
                const insta1 = acf.instagram1 || '@chinhyosook_official';
                const insta2 = acf.instagram2 || '@projectchf';

                // 2. 텍스트 정보 화면에 뿌려주기
                document.getElementById('address-field').innerHTML = `
                    <p>${formatAddress(addressName)}<br>${formatAddress(addressKo)} ${formatAddress(addressDetail)}</p>
                    <p style="margin-top: 1.5rem;">${formatAddress(addressEn)}</p>
                `;
                document.getElementById('phone-field').textContent = phone;
                document.getElementById('email-field').innerHTML = `<a href="mailto:${email}">${email}</a>`;

                let instaHTML = '';
                if (insta1) instaHTML += `<a href="https://instagram.com/${insta1.replace('@', '')}" target="_blank" rel="noopener noreferrer">${insta1}</a><br>`;
                if (insta2) instaHTML += `<a href="https://instagram.com/${insta2.replace('@', '')}" target="_blank" rel="noopener noreferrer">${insta2}</a>`;
                document.getElementById('instagram-field').innerHTML = instaHTML;

            } catch (error) {
                console.error(error);
            }
        }

        // 페이지가 열리면 즉시 실행!
        document.addEventListener('DOMContentLoaded', initContactPage);
    </script>

    <footer class="site-footer">
        &copy; 2026 Project CH&F. All rights reserved. <br> | website by JEAN
    </footer>
</body>

</html>
